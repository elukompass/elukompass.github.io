<!doctype html>
<html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#041019"><meta name="robots" content="noindex">
<title>Sinu Kompass · Floreo</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Floreo 2+1: deep sea + gold (main) + Aqua Jade touch */
:root{--bg1:#041019;--bg2:#0b2a3a;--ink:#eaf6f8;--muted:#c3d6dd;--gold:#ffc861;--jade:#74ffed;--card:rgba(8,28,40,.62);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:500 17px/1.5 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg1);-webkit-font-smoothing:antialiased}
.sea{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#041019 url(../../assets/sea.jpg) 55% center/cover no-repeat}
.sea video{width:100%;height:100%;object-fit:cover;object-position:53% center;display:block}
.sea-dim{position:absolute;inset:0;background:radial-gradient(60% 30% at 50% 8%,rgba(255,200,97,.10),transparent 70%),linear-gradient(180deg,rgba(4,16,25,.88) 0%,rgba(4,16,25,.72) 30%,rgba(4,16,25,.8) 60%,rgba(4,16,25,.94) 100%)}
@media (prefers-reduced-motion:reduce){.sea video{display:none}}
main{max-width:560px;margin:0 auto;padding:26px 16px 48px;min-height:100vh}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px}
.brand img{width:64px;height:64px;filter:drop-shadow(0 0 18px rgba(255,200,97,.45))}
.brand span{font:400 14px Marcellus,serif;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
/* stepper: 5 dots on a line, done = gold ✓, now = jade ring */
.steps{position:relative;display:flex;justify-content:space-between;margin:6px 6px 26px}
.steps:before{content:"";position:absolute;left:16px;right:16px;top:15px;height:2px;background:var(--line)}
.steps .fill{position:absolute;left:16px;top:15px;height:2px;background:linear-gradient(90deg,var(--gold),var(--jade));transition:width .5s ease}
.st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;width:56px}
.st i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 14px Manrope;font-style:normal;background:#0b2230;border:2px solid var(--line);color:var(--muted);transition:all .35s}
.st b{font:500 12px Manrope;color:var(--muted);text-align:center;white-space:nowrap}
.st.done i{background:var(--gold);border-color:var(--gold);color:#1b1206}
.st.now i{border-color:var(--jade);color:var(--jade);box-shadow:0 0 0 4px rgba(116,255,237,.14),0 0 18px rgba(116,255,237,.35)}
.st.now b{color:var(--jade)}
h1,h2{font-family:"Cormorant Garamond",Marcellus,serif;font-weight:700;text-align:center;margin:0 0 10px;background:linear-gradient(180deg,#FFF1CF,#F7CD6B 45%,#E0A23A);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(30px,8vw,40px);line-height:1.1}
.lead{margin:0 auto 18px;max-width:440px;color:var(--muted);font-family:Marcellus,serif;text-align:center;letter-spacing:.02em}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.step{display:none}.step.on{display:block;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
label.q{display:block;font:400 19px/1.35 Marcellus,serif;color:var(--gold);margin:22px 0 10px}
label.q:first-child{margin-top:0}
.hint{display:block;font:500 14px Manrope;color:var(--muted);margin-top:4px}
textarea,input[type=text],input[type=email],input[type=tel]{width:100%;background:rgba(4,16,25,.7);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;font:400 17px Marcellus,serif;transition:border-color .2s,box-shadow .2s}
textarea{min-height:68px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px rgba(116,255,237,.15)}
.meter{margin-top:18px}.meter .top{display:flex;justify-content:space-between;align-items:baseline;font:400 18px Marcellus,serif;color:var(--gold)}
.meter b{font:800 22px Manrope;color:var(--jade)}
input[type=range]{width:100%;accent-color:var(--gold);margin:8px 0 2px}
.ends{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.gap{text-align:center;margin:18px 0 4px}.gap b{display:block;font:700 54px/1 "Cormorant Garamond",serif;color:var(--jade);text-shadow:0 0 22px rgba(116,255,237,.4)}.gap span{color:var(--muted);font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-direction:column;gap:10px}
.areas button,.opts button{background:rgba(4,16,25,.6);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px 14px;font:400 18px Marcellus,serif;cursor:pointer;text-align:center;transition:all .2s}
.opts button{text-align:left}
.areas button .e{display:block;font-size:26px;margin-bottom:4px}
.areas button:hover,.opts button:hover{border-color:rgba(255,200,97,.6)}
.areas button.on,.opts button.on{border-color:var(--gold);color:var(--gold);background:rgba(255,200,97,.1);box-shadow:0 0 18px rgba(255,200,97,.18)}
.nav{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;position:relative;overflow:hidden;padding:16px;border-radius:14px;border:0;cursor:pointer;font:800 16px Manrope;letter-spacing:.1em;text-transform:uppercase;color:#1b1206;background:linear-gradient(180deg,#FFE29A,#FFC861 55%,#E8A63C);box-shadow:0 10px 26px rgba(255,200,97,.28)}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}.btn:disabled:after{display:none}
.btn.back{flex:0 0 auto;padding:16px 18px;background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none}.btn.back:after{display:none}
.done{text-align:center}.done .coord{margin:16px 0;padding:16px;border-radius:16px;border:1px solid rgba(116,255,237,.35);background:rgba(116,255,237,.06);font-family:Marcellus,serif}
.done .coord small{display:block;color:var(--jade);letter-spacing:.2em;text-transform:uppercase;font:700 12px Manrope;margin-bottom:6px}
.hp{position:absolute;left:-9999px}
.sgoal{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid rgba(116,255,237,.4);background:rgba(116,255,237,.06)}
.sgoal small{display:block;font:700 11px Manrope;letter-spacing:.16em;text-transform:uppercase;color:var(--jade);margin-bottom:3px}.sgoal span{font:400 17px Marcellus,serif}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stats div{padding:10px 6px;border-radius:12px;background:rgba(4,16,25,.55);border:1px solid var(--line);text-align:center}
.stats b{display:block;font:800 18px Manrope;color:var(--gold)}.stats small{font:600 11px Manrope;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.more{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font:600 13px Manrope;letter-spacing:.06em;cursor:pointer}
.lead:empty{display:none}
.sum{text-align:left;display:grid;gap:8px;margin-top:10px}.sum[hidden]{display:none}.sum div{padding:12px 14px;border-radius:14px;background:rgba(4,16,25,.55);border:1px solid var(--line)}
.sum small{display:block;font:700 11px Manrope;letter-spacing:.16em;text-transform:uppercase;color:var(--jade);margin-bottom:3px}.sum span{font-family:Marcellus,serif;font-size:15px}
.sum div.goal{border-color:rgba(116,255,237,.4);background:rgba(116,255,237,.06)}
.btn.wa{display:block;text-align:center;text-decoration:none;margin-top:18px}
/* 19.11 v2: calmer scale; symbol only on step 1 */
body{font-size:15px}main{max-width:520px;padding-top:20px}
body.in .brand{display:none}.lead,h1,label.q{text-wrap:balance}.lead{max-width:480px}body.in .steps{margin-top:4px}
h1{font-size:clamp(24px,6vw,31px)}.lead{font-size:15px;margin-bottom:14px}
.card{padding:18px 16px;border-radius:18px}
label.q{font-size:16px;margin:16px 0 7px}.hint{font-size:13px}
textarea,input[type=text],input[type=email],input[type=tel]{padding:10px 12px;font-size:15px;border-radius:12px}
textarea{min-height:48px}
.meter{margin-top:14px}.meter .top{font-size:15px}.meter b{font-size:18px}
.gap{margin:12px 0 2px}.gap b{font-size:40px}.gap span{font-size:12px}
.areas button,.opts button{padding:11px 12px;font-size:15px;border-radius:12px}.areas button .e{font-size:21px}
.nav{margin-top:18px}.btn{padding:13px;font-size:14px;border-radius:12px}.btn.back{padding:13px 15px}
.st i{width:28px;height:28px;font-size:13px}.steps:before,.steps .fill{top:13px}.st b{font-size:11px}
</style></head><body>
<div class="sea" aria-hidden="true"><video autoplay muted loop playsinline preload="auto" poster="../../assets/sea.jpg"><source src="../../assets/sea.mp4" type="video/mp4"></video><div class="sea-dim"></div></div>
<main>
  <div class="brand"><img src="../symbol.png" alt=""><span>Floreo</span></div>

  <div class="steps" id="steps"><div class="fill" id="fill"></div>
    <div class="st"><i>1</i><b>Fookus</b></div><div class="st"><i>2</i><b>Siht</b></div><div class="st"><i>3</i><b>Distants</b></div><div class="st"><i>4</i><b>Takistused</b></div><div class="st"><i>5</i><b>Tahe</b></div>
  </div>

  <h1 id="h"></h1>
  <p class="lead" id="lead"></p>

  <div class="card">
    <section class="step on">
      <div class="areas" id="c-area">
        <button data-v="vaim"><span class="e">✨</span>Vaim</button><button data-v="keha"><span class="e">🌿</span>Keha</button>
        <button data-v="suhted"><span class="e">🤍</span>Suhted</button><button data-v="raha"><span class="e">🌊</span>Raha ja karjäär</button>
      </div>
    </section>

    <section class="step">
      <label class="q" for="f-goal">Kuhu soovid jõuda?<span class="hint">Kirjuta nii, nagu see oleks juba tõsi.</span></label><textarea id="f-goal" maxlength="300"></textarea>
      <label class="q" for="f-life">Mismoodi Su elu siis muutuks?</label><textarea id="f-life" maxlength="300"></textarea>
      <label class="q" for="f-pain">Mis on selles praegu kõige raskem?</label><textarea id="f-pain" maxlength="300"></textarea>
      <div class="nav"><button class="btn back" data-back>←</button><button class="btn" data-next>Edasi</button></div>
    </section>

    <section class="step">
      <div class="meter"><div class="top"><label for="r-now">Kus oled täna?</label><b id="r-now-v">4</b></div><input type="range" id="r-now" min="1" max="10" value="4"><div class="ends"><span>kaugel</span><span>kohal</span></div></div>
      <div class="meter"><div class="top"><label for="r-want">Kus tahaksid olla?</label><b id="r-want-v">9</b></div><input type="range" id="r-want" min="1" max="10" value="9"><div class="ends"><span>kaugel</span><span>kohal</span></div></div>
      <div class="gap"><b id="gap-n">5</b><span>sammu vahet</span></div>
      <label class="q" for="f-gap">Mis saab võimalikuks, kui Sa selle valid?<span class="hint">Millised võimalused avanevad, kui Sa selle ära teed?</span></label><textarea id="f-gap" maxlength="300"></textarea>
      <div class="nav"><button class="btn back" data-back>←</button><button class="btn" data-next>Edasi</button></div>
    </section>

    <section class="step">
      <div class="meter" style="margin-top:0"><div class="top"><label for="r-time">Vaba aega iseendale päevas</label><b id="r-time-v">2 tundi</b></div><input type="range" id="r-time" min="0" max="12" value="2"><div class="ends"><span>alla 1 tunni</span><span>12 tundi</span></div></div>
      <div class="meter"><div class="top"><label for="r-energy">Energia tavalisel päeval</label><b id="r-energy-v">5</b></div><input type="range" id="r-energy" min="1" max="10" value="5"><div class="ends"><span>🪫 vähe</span><span>🔋 palju</span></div></div>
      <label class="q" for="f-drain">Mis sööb Su energiat kõige rohkem?</label><textarea id="f-drain" maxlength="300"></textarea>
      <div class="meter"><div class="top"><label for="r-people">Kui palju lähedased Sind toetavad?</label><b id="r-people-v">5</b></div><input type="range" id="r-people" min="1" max="10" value="5"><div class="ends"><span>üldse mitte</span><span>täielikult</span></div></div>
      <label class="q">Kas Sul on vabu vahendeid, mida soovi korral iseendasse investeerida?</label>
      <div class="opts" id="c-money"><button data-v="jah">Jah, vahendid on olemas</button><button data-v="umber">On, kuid piiratud hulgal</button><button data-v="ei">Praegu mitte</button></div>
      <div class="nav"><button class="btn back" data-back>←</button><button class="btn" data-next>Edasi</button></div>
    </section>

    <section class="step">
      <div class="meter" style="margin-top:0"><div class="top"><label for="r-will">Kui väga Sa seda päriselt tahad?</label><b id="r-will-v">7</b></div><input type="range" id="r-will" min="1" max="10" value="7"><div class="ends"><span>proovin</span><span>teen ära</span></div></div>
      <label class="q" for="f-ready">Mida Sa tunned? Millal Sa selle valid?<span class="hint">Millal oled selleks valmis?</span></label><textarea id="f-ready" maxlength="300"></textarea>
      <label class="q" for="f-name">Eesnimi</label><input type="text" id="f-name" maxlength="60" autocomplete="given-name">
      <label class="q" for="f-email">E-post</label><input type="email" id="f-email" maxlength="120" autocomplete="email">
      <label class="q" for="f-phone">Telefon</label><input type="tel" id="f-phone" maxlength="30" autocomplete="tel">
      <input type="text" class="hp" id="r-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="nav"><button class="btn back" data-back>←</button><button class="btn" id="send" disabled>Kinnitan</button></div>
    </section>

    <section class="step done" id="s-done">
      <div class="sgoal"><small id="s-area"></small><span id="s-goal"></span></div>
      <div class="stats"><div><b id="s-dist"></b><small>Distants</small></div><div><b id="s-en"></b><small>Energia</small></div><div><b id="s-will"></b><small>Tahe</small></div></div>
      <a class="btn wa" id="wa" target="_blank" rel="noopener">Saada WhatsAppi</a>
      <button class="more" id="more" type="button">Kõik vastused ▾</button>
      <div class="sum" id="sum" hidden></div>
      <p class="lead" id="wa-note" hidden style="margin:10px auto 0;font-size:13px"></p>
    </section>
  </div>
</main>
<script>
// Answers go to the Floreo sheet once the Apps Script knows kind "s25" (tab "S2-S5 vastused"). Until then SEND_LIVE stays false.
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzMiAnvUs-WQsE-cfSAFlNbcv0nwto0u8tTTS5JAAIDqrxYnxz--lGFgcg1o_6rDcdleQ/exec";
const SEND_LIVE = false;
const $ = id => document.getElementById(id), val = id => $(id).value.trim();
const emailOk = s => /^[^\s@]{1,64}@[^\s@]{1,190}\.[a-z]{2,24}$/i.test(s);
const HEAD = [
  ["Sinu fookus", "Vali eluvaldkond, kus soovid praegu kõige rohkem õitsengut."],
  ["Sinu siht", "Kuhu Sa liigud ja miks see Sulle oluline on?"],
  ["Distants Sinu Sihini", "Kui kaugel see täna on ja mida see vahe Sult võtab?"],
  ["Mis Sind tagasi hoiab", "Aeg, energia, inimesed ja raha. Nähtav takistus on ületatav."],
  ["Sinu Tahe", "See on võimalik, kui see on Sulle tõeliselt oluline."],
  ["Kokkuvõte", ""]];
let area = "", money = "", cur = 0;
const steps = [...document.querySelectorAll(".step")], dots = [...document.querySelectorAll(".st")];
const need = [() => area, () => val("f-goal") && val("f-life") && val("f-pain"), () => val("f-gap"), () => money && val("f-drain"), () => val("f-ready") && val("f-name") && emailOk(val("f-email")) && val("f-phone")];
function refresh(){ steps.forEach((s, k) => { const b = s.querySelector("[data-next]"); if (b) b.disabled = !need[k](); }); $("send").disabled = !need[4](); }
function show(i){ cur = i; document.body.classList.toggle("in", i > 0); steps.forEach((s, k) => s.classList.toggle("on", k === i));
  dots.forEach((d, k) => { d.classList.toggle("done", k < i); d.classList.toggle("now", k === i); d.querySelector("i").textContent = k < i ? "✓" : k + 1; });
  $("fill").style.width = "calc((100% - 32px) * " + Math.min(i, 4) / 4 + ")";
  $("h").textContent = HEAD[i][0]; $("lead").textContent = HEAD[i][1]; refresh(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function chooser(id, set){ const box = $(id); box.querySelectorAll("button").forEach(b => b.onclick = () => { box.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); set(b.dataset.v); refresh(); }); }
chooser("c-area", v => { area = v; setTimeout(() => { if (cur === 0) show(1); }, 350); }); chooser("c-money", v => money = v);
const gap = () => { $("gap-n").textContent = Math.max(0, $("r-want").value - $("r-now").value); };
["now","want","energy","people","will"].forEach(k => { const r = $("r-" + k); r.oninput = () => { $("r-" + k + "-v").textContent = r.value; gap(); }; });
const hrs = n => n == 0 ? "Alla 1 tunni" : n == 1 ? "1 tund" : n + " tundi"; $("r-time").oninput = () => $("r-time-v").textContent = hrs(+$("r-time").value);
document.querySelectorAll("[data-next]").forEach(b => b.onclick = () => show(cur + 1));
document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => show(cur - 1));
document.addEventListener("input", e => { if (e.target.tagName === "TEXTAREA") { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + 2 + "px"; } refresh(); });
$("send").onclick = () => {
  const now = new Date().toISOString();
  const data = { kind: "s25", ts: now, src: new URLSearchParams(location.search).get("src") || "", name: val("f-name"), email: val("f-email"), phone: val("f-phone"), area, consent: now,
    goal: val("f-goal"), life: val("f-life"), pain: val("f-pain"), now: +$("r-now").value, want: +$("r-want").value, gap: val("f-gap"),
    time: +$("r-time").value, energy: +$("r-energy").value, drain: val("f-drain"), people: +$("r-people").value, money,
    will: +$("r-will").value, ready: val("f-ready"), website: val("r-hp") };
  if (SEND_LIVE) { try { fetch(ENDPOINT, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain" }, body: JSON.stringify(data) }); } catch (e) {} }
  const AREA = { vaim: "Vaim", keha: "Keha", suhted: "Suhted", raha: "Raha ja karjäär" }, MONEY = { jah: "Jah, vahendid on olemas", umber: "On, kuid piiratud hulgal", ei: "Praegu mitte" };
  const rows = [["Fookus", AREA[area]], ["Siht", data.goal, "goal"], ["Elu siis", data.life], ["Kõige raskem praegu", data.pain],
    ["Distants", data.now + " → " + data.want + " (" + Math.max(0, data.want - data.now) + " sammu)"], ["Kui kõik jääb samaks", data.gap],
    ["Vaba aeg päevas", hrs(data.time)], ["Energia", data.energy + "/10 · " + data.drain], ["Lähedaste tugi", data.people + "/10"], ["Vahendid", MONEY[money]],
    ["Tahe", data.will + "/10"], ["Valmis", data.ready]];
  $("sum").innerHTML = rows.map(r => `<div class="${r[2] || ""}"><small>${r[0]}</small><span></span></div>`).join("");
  [...$("sum").querySelectorAll("span")].forEach((el, k) => el.textContent = rows[k][1]);
  const men = new URLSearchParams(location.search).get("s") === "mees";
  const WA = men ? "37255628934" : "3725299119", who = men ? "Hendrik" : "Kaidi";
  const msg = "Tere " + who + "! Siin on minu Kompass 🧭\n\n" + rows.map(r => r[0] + ": " + r[1]).join("\n") + "\n\n" + data.name;
  $("wa").href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(msg);
  $("wa").textContent = "Saada kokkuvõte " + (men ? "Hendrikule" : "Kaidile");
  $("wa-note").textContent = "Üks klikk ja Su kokkuvõte on " + (men ? "Hendrikul" : "Kaidil") + " olemas.";
  $("s-area").textContent = AREA[area]; $("s-goal").textContent = data.goal;
  $("s-dist").textContent = data.now + " → " + data.want; $("s-en").textContent = data.energy + "/10"; $("s-will").textContent = data.will + "/10";
  $("more").onclick = () => { const h = $("sum").hidden; $("sum").hidden = !h; $("more").textContent = h ? "Peida ▴" : "Kõik vastused ▾"; };
  $("wa-note").textContent = "Avaneb WhatsApp, kus saad kokkuvõtte " + (men ? "Hendrikuga" : "Kaidiga") + " ühe klikiga jagada."; $("wa-note").hidden = false; show(5);
};
show(0);
</script></body></html>
