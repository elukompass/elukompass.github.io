<!doctype html>
<html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="robots" content="noindex"><title>Kompass harjutus · Floreo</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;700;800&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#041019;--bg2:#0b2a3a;--ink:#eaf6f8;--muted:#c3d6dd;--gold:#ffc861;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}html,body{margin:0}
body{font:500 17px/1.5 Manrope,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg2),var(--bg1) 70%) fixed;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:28px 16px 60px}
h1,h2{font-family:"Cormorant Garamond",Marcellus,serif;text-align:center;margin:0 0 10px;background:linear-gradient(180deg,#FFF1CF,#F7CD6B 45%,#E0A23A);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(28px,7.4vw,38px);line-height:1.12}h2{font-size:27px}
p{margin:0 0 14px;color:var(--muted);font-family:Marcellus,serif;text-align:center}
.kicker{font:400 17px Marcellus,serif;color:var(--gold);text-align:center;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:18px 0}
.tag{display:inline-block;font:800 13px Manrope;letter-spacing:.2em;color:var(--gold);margin-bottom:6px}
label.q{display:block;font:400 18px/1.35 Marcellus,serif;color:var(--gold);margin:20px 0 8px}
textarea,input[type=text],input[type=email],input[type=tel]{width:100%;background:rgba(4,16,25,.6);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;font:400 17px Marcellus,serif}
textarea{height:64px;resize:vertical}textarea:focus,input:focus{outline:none;border-color:var(--gold)}
.meter .top{display:flex;justify-content:space-between;font:400 18px Marcellus,serif;color:var(--gold)}.meter b{color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--gold)}.ends{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}.opts button,.areas button{background:rgba(4,16,25,.6);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px;font:400 17px Marcellus,serif;cursor:pointer;text-align:left}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts button.on,.areas button.on{border-color:var(--gold);color:var(--gold)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;margin-top:22px;padding:16px;cursor:pointer;background:rgba(10,18,34,.85);color:#C3D5E6;border:1.5px solid rgba(169,194,218,.7);border-radius:10px;font:800 17px Manrope;letter-spacing:.12em;text-transform:uppercase}
.btn:disabled{opacity:.5;cursor:default}.hp{position:absolute;left:-9999px}.hidden{display:none}
</style></head><body><main>
<div class="kicker">Kompass</div><h1>Sinu 10 minutit</h1>
<p>Üks leht, neli sammu. Vasta lühidalt ja ausalt, et meie 1:1 kõne läheks kohe asja juurde.</p>

<div class="card"><span class="tag">ALGUS</span>
<label class="q" for="f-name">Eesnimi</label><input type="text" id="f-name" maxlength="60" autocomplete="given-name">
<label class="q" for="f-email">E-post</label><input type="email" id="f-email" maxlength="120" autocomplete="email">
<label class="q">Mis valdkond on praegu kõige olulisem?</label>
<div class="areas" id="c-area"><button data-v="keha">Keha</button><button data-v="vaim">Vaim</button><button data-v="raha">Raha ja töö</button><button data-v="suhted">Suhted</button></div></div>

<div class="card"><span class="tag">SAMM 2 · SIHT</span>
<label class="q" for="f-pain">PAIN · Mis on selles valdkonnas praegu kõige raskem?</label><textarea id="f-pain" maxlength="300"></textarea>
<label class="q" for="f-goal">GOAL · Kuhu soovid jõuda? Üks lause.</label><textarea id="f-goal" maxlength="300"></textarea></div>

<div class="card"><span class="tag">SAMM 3 · DISTANTS</span>
<div class="meter"><div class="top"><label for="r-now">Kus oled täna?</label><b id="r-now-v">4</b></div><input type="range" id="r-now" min="1" max="10" value="4"><div class="ends"><span>kaugel</span><span>kohal</span></div></div>
<div class="meter" style="margin-top:14px"><div class="top"><label for="r-want">Kus tahaksid olla?</label><b id="r-want-v">9</b></div><input type="range" id="r-want" min="1" max="10" value="9"><div class="ends"><span>kaugel</span><span>kohal</span></div></div>
<label class="q" for="f-gap">GAP · Mis jääb vahele sinu ja sihi vahele?</label><textarea id="f-gap" maxlength="300"></textarea></div>

<div class="card"><span class="tag">SAMM 4 · TAKISTUSED</span>
<div class="meter"><div class="top"><label for="r-energy">Energia tavalisel päeval</label><b id="r-energy-v">5</b></div><input type="range" id="r-energy" min="1" max="10" value="5"><div class="ends"><span>🪫 vähe</span><span>🔋 palju</span></div></div>
<label class="q" for="f-drain">Mis sööb Su aega ja energiat kõige rohkem?</label><textarea id="f-drain" maxlength="300"></textarea>
<label class="q">MONEY · Kas on vahendeid, mida soovi korral iseendasse investeerida?</label>
<div class="opts" id="c-money"><button data-v="jah">Jah, vahendid on olemas</button><button data-v="umber">On, kuid piiratud hulgal</button><button data-v="ei">Praegu mitte</button></div></div>

<div class="card"><span class="tag">SAMM 5 · TAHE</span>
<div class="meter"><div class="top"><label for="r-will">WILL · Minu tahe seda teha</label><b id="r-will-v">7</b></div><input type="range" id="r-will" min="1" max="10" value="7"><div class="ends"><span>proovin</span><span>teen ära</span></div></div>
<label class="q" for="f-stop">Millest oled valmis loobuma, et see juhtuks?</label><textarea id="f-stop" maxlength="300"></textarea></div>

<div class="card"><span class="tag">VIIMANE</span>
<label class="q" for="f-phone">Telefon, kuhu helistame</label><input type="tel" id="f-phone" maxlength="30" autocomplete="tel">
<input type="text" class="hp" id="r-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="btn" id="send" disabled>Broneeri 1:1 kõne</button>
<p id="msg" class="hidden" style="margin-top:14px"></p></div>
</main>
<script>
// DRAFT: not deployed. Needs the Apps Script to know kind "s25" → tab "S2-S5 vastused" (see apps-script note). Until then SEND_LIVE stays false.
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzMiAnvUs-WQsE-cfSAFlNbcv0nwto0u8tTTS5JAAIDqrxYnxz--lGFgcg1o_6rDcdleQ/exec";
const SEND_LIVE = false;
const BOOK = "https://elukompass.github.io/broneeri.html";
const $ = id => document.getElementById(id), val = id => $(id).value.trim();
const emailOk = s => /^[^\s@]{1,64}@[^\s@]{1,190}\.[a-z]{2,24}$/i.test(s);
let area = "", money = "";
function chooser(id, set){ const box=$(id); box.querySelectorAll("button").forEach(b=>b.onclick=()=>{box.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));set(b.dataset.v);check();}); }
chooser("c-area", v=>area=v); chooser("c-money", v=>money=v);
["now","want","energy","will"].forEach(k=>{const r=$("r-"+k);r.oninput=()=>$("r-"+k+"-v").textContent=r.value;});
const need=["f-name","f-email","f-pain","f-goal","f-gap","f-stop","f-phone"];
function check(){ $("send").disabled=!(need.every(i=>val(i))&&emailOk(val("f-email"))&&area&&money); }
need.forEach(i=>$(i).addEventListener("input",check));
document.addEventListener("input",e=>{if(e.target.tagName==="TEXTAREA"){e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+2+"px";}});
$("send").onclick=()=>{
  const now=new Date().toISOString();
  const data={kind:"s25",ts:now,name:val("f-name"),email:val("f-email"),phone:val("f-phone"),area,consent:now,
    pain:val("f-pain"),goal:val("f-goal"),now:+$("r-now").value,want:+$("r-want").value,gap:val("f-gap"),
    energy:+$("r-energy").value,drain:val("f-drain"),money,will:+$("r-will").value,stop:val("f-stop"),website:val("r-hp")};
  if(SEND_LIVE){ try{ fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(data)}); }catch(e){} }
  $("send").disabled=true; $("msg").textContent="Aitäh. Viin Sind ajavalikusse.";$("msg").classList.remove("hidden");
  setTimeout(()=>{location.href=BOOK+"?k=&a="+encodeURIComponent(area);},900);
};
</script></body></html>
