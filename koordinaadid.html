    keha:   { name: "Jõu RUUM", sub: "Liigu selgel suunal juba 7 päevaga.", l: [[MK, " – mõista, miks Su füüsis ei muutu ja ehita endale rutiin ja keha, mis kannab Sind elus tugevalt edasi"], ["Trennikava ja lihtsad retseptid", " – saa parem enesetunne juba esimesel nädalal"]] },
    vaim:   { name: "Väe RUUM", sub: "Ela rahus ja rõõmus.", l: [[MK, " – lõpeta enda tagaplaanile jätmine ja vabane piiravatest uskumustest"], ["Meditatsioonid ja hingamisharjutused", " – leia sisemine kindlus ja ühendus enda keskmega"]] },
    raha:   { name: "Edu RUUM", sub: "Liigu selgel suunal juba 7 päevaga.", l: [[MK, " – näe, millised mõttemustrid hoiavad Sind rahalises pinges, ja ehita jätkusuutlik õitseng"], ["Rahakalkulaator, automatsioonid ja loomise tööriistad", " – ehita selge süsteem, mis viib Sind finantskindluse ja vabaduseni"]] },
    suhted: { name: "Südame RUUM", sub: "Ole päriselt Sina ja kohalolus oma lähedaste jaoks.", l: [[MK, " – mõista, kus Sa oled oma elus kaitses ja õpi oma südant avama"], ["Sisemaailma harjutused", " – astu iseenda väesse ja taasühendu teistega"]] },
  };
  const NOFFER = {
    keha:   { name: "Eluväe RUUM", sub: "Tule viie päevaga tagasi oma kehasse.", l: [[MK, " – mõista, miks energia kaob, ja leia see endas uuesti"], ["5 päeva väikeseid samme", " – keha, mis kannab Sind kergelt läbi päeva"]] },
    vaim:   { name: "Rahu RUUM", sub: "Leia koht, kuhu saad alati tagasi tulla.", l: [[MK, " – peatu ja tule rattast välja"], ["Meditatsioonid ja hingamine", " – rahu, mis jääb ka siis, kui maailm läheb valjuks"]] },
    suhted: { name: "Armastuse RUUM", sub: "Armastus algab suhtest iseendaga.", l: [[MK, " – astu lähemale iseendale"], ["Sisemaailma harjutused", " – õpi vastu võtma, mitte ainult andma"]] },
    raha:   { name: "Õitsengu RUUM", sub: "Vaata raha ja tööd uue pilguga.", l: [[MK, " – näe, kus Sa end väikseks teed"], ["5 päeva väikeseid samme", " – astu üks samm küllusesse"]] },
  };
  function paintCourse(a) {
    const OFFERS = sex === "naine" ? NOFFER : MOFFER;
    const O = OFFERS[a] || { name: "RUUM kursus", sub: "Liigu selgel suunal juba 7 päevaga.", l: [[MK, " – lõpeta enda tagaplaanile jätmine ja ehita selge suund"]] };
    $("m-head").textContent = O.name; $("m-sub").textContent = O.sub;
    $("m-list").innerHTML = O.l.map(([b, t]) => `<li style="margin:0 0 8px;font-size:14.5px;line-height:1.45">✓ <b>${b}</b>${t}</li>`).join("");
    $("m-buy").href = PAY[sex];
    if (OFFERS[a]) $("m-img").src = `assets/bg/${a}-${sex === "naine" ? "n" : "m"}.jpg?v=0506b`; else $("m-img").style.display = "none";
  }

  function setArea(a) {
    area = a; const A = AREAS[a]; paintCourse(a);
    $("form-h").textContent = "Sinu SIHT: " + (sex === "mees" ? SIHT_M : SIHT_N)[a]; $("form-h").style.whiteSpace = "normal"; $("form-p").textContent = A.p;
    $("lab-a").textContent = A.la; $("lab-b").textContent = A.lb;
    $("f-a").placeholder = A.pa[sex]; $("f-b").placeholder = A.pb;
    show("s-form");
  }

  const val = id => ($(id) ? $(id).value.trim() : "");
  const check = () => { $("to-who").disabled = !(val("f-a") && val("f-b")); };
  ["f-a", "f-b"].forEach(id => $(id).addEventListener("input", check));

  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));
  document.querySelectorAll(".areas button").forEach(b => b.addEventListener("click", () => setArea(b.dataset.a)));

  // Opted in at Kompass: no second form. Another device: the row waits on a browser id, Day 5 joins the email
  const PAEV_LIVE = true;   // on after the Apps Script knows kind "paev"
  $("to-who").addEventListener("click", () => {
    const A = AREAS[area], now = new Date().toISOString();
    let kc = {}; try { kc = JSON.parse(localStorage.getItem("kc") || "{}"); } catch (e) {}
    if (!kc.cid) kc.cid = Math.random().toString(36).slice(2, 12);
    const answers = { a: val("f-a"), b: val("f-b"), mode: A.mode };
    const data = kc.email ? { kind: "siht", ts: now, sex, area, mode: A.mode, name: kc.name || "", email: kc.email, consent: now, a: answers.a, b: answers.b, share: "ei", website: "" }
      : { kind: "paev", day: 2, cid: kc.cid, ts: now, sex, area, answers: JSON.stringify(answers), website: "" };
    if (!PREVIEW && window.fbq) { try { history.replaceState(null, "", location.pathname + location.search + "#koordinaat"); } catch (e) {} fbq("track", "PageView"); fbq("trackCustom", "Koordinaat", { content_name: area }); }
    if (ENDPOINT && !PREVIEW && (kc.email || PAEV_LIVE)) { try { fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(data) }); } catch (e) {} }
    try { Object.assign(kc, { sex, area, goal: A.mode === "energia" ? answers.b : answers.a }); localStorage.setItem("kc", JSON.stringify(kc)); } catch (e) {}   // day 3–5 read this
    $("done-h").textContent = (kc.name ? kc.name.split(" ")[0] + ", " : "") + "Sinu suund on paigas.";
    $("coord").innerHTML = `<div class="lab">${esc(A.la)}</div><div class="val${A.mode === "energia" ? " from" : ""}">${esc(answers.a)}</div>
      <div class="lab">${esc(A.lb)}</div><div class="val">${esc(answers.b)}</div>`;
    $("done-p").innerHTML = sex === "mees" ? 'Nüüd tead, kuhu Sa lähed. Ainult teadmisest ei piisa.<br><b style="display:block;margin-top:8px;font-size:1.25em;color:var(--gold)">Tee täna esimene samm.</b>' : 'Nüüd tead, kuhu Sa lähed.<br><b style="display:block;margin-top:8px;font-size:1.25em;color:var(--gold)">Luba endal täna esimene samm astuda.</b>';
    $("day3").href = `paev3.html?s=${sex}&a=${area}`;
    show("s-done");
  });

  (() => { const nav = document.createElement("div"); nav.className = "daynav"; nav.setAttribute("aria-label", "Päev 2 / 5");
    nav.innerHTML = [1, 2, 3, 4, 5].map(i => `<span class="${i === 2 ? "on" : i < 2 ? "done" : ""}">${i}</span>`).join("");
    document.querySelector(".brand").after(nav); })();
  document.addEventListener("input", e => { if (e.target.tagName === "TEXTAREA") { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + 2 + "px"; } });   // boxes grow with the text
  (() => { const k = document.querySelector(".brand svg.kompass"); if (!k) return; k.style.cursor = "pointer"; k.addEventListener("click", () => location.reload()); })();   // emblem = back to the start of this day
  area ? setArea(area) : show("s-pick");
</script>
</body>
</html>
