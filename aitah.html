<body>
<div class="sea" aria-hidden="true"><video autoplay muted loop playsinline preload="auto" poster="assets/sea.jpg"><source src="assets/sea.mp4" type="video/mp4"></video><div class="sea-dim"></div></div>
<main>
  <div class="brand"><svg class="kompass" aria-hidden="true" viewBox="0 0 100 100"><defs><radialGradient id="kBrass" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFF1B8"/><stop offset="0.45" stop-color="#E2B54E"/><stop offset="1" stop-color="#7A5214"/></radialGradient><radialGradient id="kFace" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#2A4E7A"/><stop offset="0.6" stop-color="#16324F"/><stop offset="1" stop-color="#0A1A2E"/></radialGradient><linearGradient id="kGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#B8862E"/></linearGradient></defs><circle cx="50" cy="50" r="48" fill="url(#kBrass)"/><circle cx="50" cy="50" r="42" fill="url(#kFace)" stroke="#5A3D10" stroke-width="1"/><g class="k-ring" fill="none" stroke="#E2C27A" stroke-width="0.6" opacity="0.8"><circle cx="50" cy="50" r="38"/><circle cx="50" cy="50" r="30" stroke-dasharray="1 2"/><circle cx="50" cy="50" r="16"/><circle cx="50" cy="42" r="8"/><circle cx="57" cy="46" r="8"/><circle cx="57" cy="54" r="8"/><circle cx="50" cy="58" r="8"/><circle cx="43" cy="54" r="8"/><circle cx="43" cy="46" r="8"/></g><g class="k-rose"><path d="M50 10 L54 46 L50 50 L46 46Z M50 90 L54 54 L50 50 L46 54Z M10 50 L46 46 L50 50 L46 54Z M90 50 L54 46 L50 50 L54 54Z" fill="url(#kGold)" stroke="#6B4A12" stroke-width="0.5"/><path d="M50 22 L52 48 L50 50 L48 48Z M78 50 L52 52 L50 50 L52 48Z M50 78 L48 52 L50 50 L52 52Z M22 50 L48 48 L50 50 L48 52Z" fill="#9FD4FF" opacity="0.55" transform="rotate(45 50 50)"/><path d="M50 10 L54 46 L50 50Z" fill="#E5483D"/></g><g font-family="Marcellus, serif" font-size="7" fill="#FFE9A8" text-anchor="middle"><text x="50" y="7.5">N</text><text x="50" y="98">S</text><text x="96" y="52.5">E</text><text x="4" y="52.5">W</text></g><circle cx="50" cy="50" r="3.2" fill="url(#kBrass)" stroke="#5A3D10" stroke-width="0.5"/><ellipse cx="38" cy="30" rx="16" ry="7" fill="#FFFFFF" opacity="0.12" transform="rotate(-30 38 30)"/></svg><span>Kompass</span><span class="day">Kursikõne</span></div>
  <section class="screen on" id="s-ty">
    <div class="kicker">Sinu aeg on kinni</div>
    <h1 id="ty-h" style="white-space:normal"></h1>
    <div class="coord"><div class="lab">Sinu kõne</div><div class="val" id="ty-when"></div><div class="lab">Kuidas</div><div class="val">Google Meet, link tuleb Sulle kirjaga.</div></div>
    <h2 style="margin-top:10px">Enne kõnet</h2>
    <ul class="k-list" style="margin-bottom:6px">
      <li><b>1.</b> Hoia oma SIHT meeles, sellest alustame.</li>
      <li><b>2.</b> Ole kõne ajal vaikses kohas.</li>
    </ul>
  </section>
</main>
<script src="paev.js"></script>
<script>
const MONTHS = ["jaanuar", "veebruar", "märts", "aprill", "mai", "juuni", "juuli", "august", "september", "oktoober", "november", "detsember"], DAYS = ["pühapäev", "esmaspäev", "teisipäev", "kolmapäev", "neljapäev", "reede", "laupäev"];
const pad = n => String(n).padStart(2, "0");
$("ty-h").textContent = (st.name ? st.name.split(" ")[0] + ", n" : "N") + "äeme varsti.";
const w = st.booked ? new Date(st.booked) : null;
$("ty-when").textContent = w ? `${DAYS[w.getDay()]}, ${w.getDate()}. ${MONTHS[w.getMonth()]} kell ${pad(w.getHours())}:${pad(w.getMinutes())} · 20 minutit` : "Kirjutame Sulle ja lepime aja kokku";
</script>
</body>
</html>
